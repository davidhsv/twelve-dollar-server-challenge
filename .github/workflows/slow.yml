# Fork-only: the servers with their database on a slow device: device-mapper "delay" over a loop
# device on the runner (read, write and flush delays in ms), optionally throttled in bytes per
# second by the container's cgroup. Matrix entries are rd:wr:flush:wbps.
name: slow disk
on:
  push:
    branches: [bench-slow]
permissions:
  contents: read
jobs:
  slow:
    strategy:
      fail-fast: false
      matrix:
        disk: ["1:3:10:40mb|8", "1:3:10:40mb|10", "1:3:10:40mb|11", "1:3:10:40mb|12"]
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: slow device
        run: |
          CFG="${{ matrix.disk }}"; IFS=: read RD WD FD BPS <<< "${CFG%%|*}"; echo "SLOW_SCALE=${CFG#*|}" >> $GITHUB_ENV
          uname -r
          sudo modprobe dm-delay || { sudo apt-get install -y -qq linux-modules-extra-$(uname -r) && sudo modprobe dm-delay; }
          sudo truncate -s 6G /mnt/slow.img
          LOOP=$(sudo losetup -f --show /mnt/slow.img)
          SZ=$(sudo blockdev --getsz $LOOP)
          sudo dmsetup create slow --table "0 $SZ delay $LOOP 0 $RD $LOOP 0 $WD $LOOP 0 $FD" \
            || sudo dmsetup create slow --table "0 $SZ delay $LOOP 0 $RD $LOOP 0 $WD"
          sudo dmsetup table slow
          sudo mkfs.ext4 -q /dev/mapper/slow && sudo mkdir -p /slow && sudo mount /dev/mapper/slow /slow && sudo chmod 777 /slow
          echo "fsync'd 4 KB writes:"; dd if=/dev/zero of=/slow/t bs=4k count=200 oflag=dsync 2>&1 | tail -1
          echo "BPS=$BPS" >> $GITHUB_ENV
      - name: run
        run: |
          throttle=(); [ -n "$BPS" ] && throttle=(--device-write-bps /dev/mapper/slow:$BPS)
          docker run --rm --privileged --network host --ulimit nofile=1048576:1048576 -v "$PWD":/repo -v /slow:/slow -w /repo \
            "${throttle[@]}" -e STEPS="$(cat .bench/slow_steps)" -e SLOW="$(cat .bench/slow)" -e SLOW_SCALE="$SLOW_SCALE" ubuntu:24.04 \
            bash -c 'if [ -n "'"$BPS"'" ]; then echo "throttled dd:"; dd if=/dev/zero of=/slow/t2 bs=1M count=200 oflag=direct 2>&1 | tail -1; fi; bash .bench/ci.sh'
