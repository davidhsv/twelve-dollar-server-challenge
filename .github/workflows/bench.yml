# Fork-only: builds the Goose entry on x86-64, runs the test suite, and compares it with
# rust-iouring-kensac and goose-iouring-ahmadsh2007 under the same native load generator.
name: bench x86
on:
  push:
    branches: [bench-x86]
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: machine
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|Thread|MHz|L2|L3|Flags" | cut -c1-400
          uname -r; free -m | sed -n 2p
      - name: tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 jq curl openssl valgrind time
      - name: seed
        run: bash seed/make-seed.sh
      - name: install.sh
        run: |
          /usr/bin/time -v sudo bash submissions/goose-iouring-davidhsv/install.sh 2> /tmp/install.time | tail -3
          grep -E "Maximum resident|Elapsed" /tmp/install.time
      - name: test/run.sh (x86-64)
        run: bash test/run.sh submissions/goose-iouring-davidhsv
      - name: layout
        run: |
          sudo mkdir -p /b /data && sudo chown $USER /b /data
          sudo ln -s $GITHUB_WORKSPACE /repo && sudo ln -s $GITHUB_WORKSPACE/.bench /work
          cp seed/feed.db /data/feed.db
          gcc -O2 -pthread -o /b/loadgen .bench/loadgen/loadgen.c
          sudo sysctl -w net.ipv4.ip_local_port_range="1024 65535" net.core.somaxconn=4096
      - name: build mine
        run: |
          /usr/bin/time -v bash .bench/sync.sh 2> /tmp/build.time | tail -4
          grep -E "Maximum resident|Elapsed" /tmp/build.time
      - name: build baselines
        run: |
          sudo bash submissions/rust-iouring-kensac/install.sh > /dev/null 2>&1
          cp -r submissions/rust-iouring-kensac /b/kensac && (cd /b/kensac && bash build.sh 2>&1 | tail -1)
          cp -r submissions/goose-iouring-ahmadsh2007 /b/goose-ref && (cd /b/goose-ref && bash build.sh 2>&1 | tail -2)
      - name: several rings (8,192 descriptors a ring), 33k requests/s
        run: |
          export LG_CPUS=1-3 LG_THREADS=3 NOFILE=8192
          bash .bench/cmp.sh 40000 8 15 30 3 /b/kensac /b/goose-ref /b/mine "/b/mine@FEED_WAIT_US=2000"
          grep -c "ring .* added" /data/run/server.log || true
      - name: past saturation, 49k requests/s offered
        run: |
          export LG_CPUS=1-3 LG_THREADS=3
          bash .bench/cmp.sh 40000 12 15 30 3 /b/kensac /b/goose-ref /b/mine
      - name: past saturation, several rings
        run: |
          export LG_CPUS=1-3 LG_THREADS=3 NOFILE=8192
          bash .bench/cmp.sh 40000 12 15 30 2 /b/kensac /b/goose-ref /b/mine "/b/mine@FEED_WAIT_US=2000"
